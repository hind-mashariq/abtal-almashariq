<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>منصة أبطال المشارق</title>
<meta name="description" content="منصة أبطال المشارق للتعزيز بين البيت والمدرسة — مدرسة المشارق للتعليم الأساسي">
<meta name="theme-color" content="#0f5c3c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=El+Messiri:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#0f5c3c;--maroon2:#0a4029;--maroon3:#17774f;--red:#c8102e;--green:#1d7a3e;--green2:#2e9b55;
  --gold:#d6a54a;--gold2:#f3d58c;--gold3:#b8862b;--cream:#fbf6ea;--sand:#efe6cf;--ink:#1f2a22;--muted:#6f7466;
  --card:#fffdf6;--shadow:0 10px 30px rgba(10,64,41,.14);--r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Tajawal',sans-serif;color:var(--ink);background:var(--cream);
  background-image:radial-gradient(circle at 20px 20px, rgba(214,165,74,.16) 2px, transparent 3px),linear-gradient(180deg,#fbf6ea 0%,#f3ead3 100%);
  background-size:40px 40px,100% 100%;background-attachment:fixed}
h1,h2,h3{font-family:'El Messiri','Tajawal',sans-serif}
button{font-family:inherit;cursor:pointer;border:0}
input,textarea,select{font-family:inherit;font-size:18px}
.flagbar{height:8px;background:linear-gradient(90deg,#fff 0 33.3%,var(--red) 33.3% 66.6%,var(--green) 66.6%)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.screen{animation:enter .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;border:2px solid #e7d9b0;position:relative}
.card.gold{border:3px solid var(--gold);box-shadow:0 0 0 5px #fff6df inset,var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:16px;font-size:19px;font-weight:800;color:#fff;
  background:linear-gradient(180deg,var(--maroon3),var(--maroon));box-shadow:0 5px 0 var(--maroon2),0 8px 18px rgba(10,64,41,.25);transition:transform .12s, box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--maroon2)}
.btn.gold{background:linear-gradient(180deg,#f0c766,var(--gold));color:var(--maroon2);box-shadow:0 5px 0 var(--gold3),0 8px 18px rgba(184,134,43,.3)}
.btn.green{background:linear-gradient(180deg,var(--green2),var(--green));box-shadow:0 5px 0 #125428,0 8px 18px rgba(29,122,62,.25)}
.btn.ghost{background:#fff;color:var(--maroon);box-shadow:0 4px 0 #e2d3a8;border:2px solid #e7d6a6}
.btn.sm{padding:8px 14px;font-size:16px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:block;margin:12px 0}
.field span{display:block;font-weight:800;margin-bottom:6px;color:var(--maroon)}
.inp{width:100%;padding:14px 16px;border-radius:14px;border:2px solid #e2cf9d;background:#fff;outline:none;transition:border .2s, box-shadow .2s}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(214,165,74,.25)}
.muted{color:var(--muted)}.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.hide{display:none!important}

/* الرئيسية التفاعلية */
.hero{border-radius:28px;overflow:hidden;box-shadow:var(--shadow);border:4px solid var(--gold);background:#fff;position:relative;line-height:0}
.hero img{display:block;width:100%;height:auto;aspect-ratio:1672/690;object-fit:cover;object-position:top}
.htitle{position:absolute;left:44%;top:8%;width:55%;height:38%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(ellipse closest-side,rgba(244,243,240,1) 76%,rgba(244,243,240,.9) 88%,rgba(244,243,240,0) 100%)}
.htitle b{font-family:'El Messiri','Tajawal',sans-serif;font-weight:700;color:#0a4a30;font-size:clamp(20px,4.6vw,58px);line-height:1.15;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.htitle i{display:block;width:60%;height:4px;margin-top:6px;border-radius:4px;background:linear-gradient(90deg,transparent,#d6a54a,transparent)}
.hot{position:absolute;border-radius:22px;background:transparent;cursor:pointer;transition:background .2s, box-shadow .2s}
.hot:hover{background:rgba(255,255,255,.18);box-shadow:0 0 0 4px rgba(214,165,74,.8)}
.hot.pulse{animation:hotp 2s infinite}
@keyframes hotp{0%,100%{box-shadow:0 0 0 0 rgba(214,165,74,.75)}50%{box-shadow:0 0 0 12px rgba(214,165,74,0)}}
.brand{display:flex;align-items:center;gap:18px;margin-top:16px;background:linear-gradient(135deg,var(--maroon),var(--maroon2));color:#fff;border:3px solid var(--gold)}
.brand h1{margin:0;font-size:clamp(28px,5vw,48px);color:var(--gold2);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.brand p{margin:4px 0 0;font-size:clamp(15px,2vw,19px);opacity:.95}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:20px}
.tile{background:linear-gradient(180deg,#fffef9,#f3ead0);border:3px solid #e6d29f;border-radius:26px;padding:22px 18px;box-shadow:0 8px 0 #dcc48a,0 14px 26px rgba(10,64,41,.13);
  display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--maroon);transition:transform .2s}
.tile:hover{transform:translateY(-4px)}
.tile:active{transform:translateY(5px);box-shadow:0 3px 0 #dcc48a}
.tile .ic{font-size:56px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18));animation:float 3s ease-in-out infinite}
.tile b{font-size:25px;font-family:'El Messiri'}.tile small{font-size:16px;color:var(--muted)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.foot{margin:26px 0 10px;text-align:center;color:var(--muted);font-size:15px}.foot b{color:var(--maroon)}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid #e7d6a6;border-radius:30px;padding:6px 14px;font-weight:700}
.fact{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.flip{background:#fff;border:2px solid #e7d6a6;border-radius:18px;padding:14px 10px;text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;color:var(--maroon);transition:.3s}
.flip .e{font-size:40px}.flip.open{background:linear-gradient(180deg,#eef8f1,#fff);border-color:#9fd6b2;font-weight:600;color:var(--ink);font-size:15px;line-height:1.6}
.qopt{display:block;width:100%;text-align:right;background:#fff;border:2px solid #e7d6a6;border-radius:14px;padding:12px 14px;margin:8px 0;font-size:18px;font-weight:700;color:var(--ink)}
.qopt.ok{background:#e5f6ea;border-color:#2e9b55}.qopt.no{background:#fde8ea;border-color:#e2566a}

/* التميمة */
.mascot{display:inline-block;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.mascot .eye{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

.login{max-width:520px;margin:30px auto}
.login .top{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:6px}
.back{background:none;color:var(--maroon);font-weight:800;font-size:17px;padding:8px 0}
.err{background:#fde8ea;color:#9b1c31;border:2px solid #f5c2c8;border-radius:14px;padding:10px 14px;margin-top:10px;font-weight:700;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ولي الأمر */
.phead{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--maroon),var(--maroon2));color:#fff;border:3px solid var(--gold)}
.phead h2{margin:0;font-size:clamp(22px,4vw,34px);color:var(--gold2)}
.phead .sub{opacity:.9;font-size:16px}
.starbox{margin-inline-start:auto;text-align:center;background:rgba(255,255,255,.1);border:2px dashed var(--gold2);border-radius:20px;padding:10px 18px;min-width:120px}
.starbox .n{font-size:46px;font-weight:900;color:var(--gold2);line-height:1}
.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.35)}}
.tchips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;margin-top:14px}
.tchip{flex:none;background:#fff;border:2px solid #e7d6a6;border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:8px;font-weight:800;color:var(--maroon);font-size:16px}
.tchip .e{font-size:26px}.tchip small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.tchip .s{background:var(--sand);border-radius:12px;padding:2px 8px;color:var(--gold3);font-size:15px}
.tchip.on{background:linear-gradient(180deg,#f0c766,var(--gold));border-color:var(--gold3);color:var(--maroon2)}
.tchip.on small{color:var(--maroon2)}.tchip.on .s{background:rgba(255,255,255,.5)}
.bar{height:22px;border-radius:20px;background:#ece2c6;overflow:hidden;border:2px solid #e2cf9d}
.bar i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--gold),#f0c766,var(--green2));transition:width .8s cubic-bezier(.2,.9,.3,1.1);position:relative}
.bar i:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.25) 0 10px,transparent 10px 20px)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:16px 0}
.day{border-radius:16px;padding:10px 4px;text-align:center;background:#fff;border:2px solid #e7d6a6;font-weight:800;color:var(--maroon);transition:.2s}
.day small{display:block;font-weight:500;color:var(--muted);font-size:13px}.day .dn{font-size:15px}.day .c{font-size:14px;margin-top:4px}
.day.today{background:linear-gradient(180deg,#f0c766,var(--gold));border-color:var(--gold3);color:var(--maroon2);transform:scale(1.06)}
.day.past{background:#f3eedf}.day.future{opacity:.5}.day.sel{outline:3px solid var(--maroon);outline-offset:2px}
.tasks{display:grid;gap:12px}
.task{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:#fff;border:2px solid #e7d6a6;font-size:20px;font-weight:800;color:var(--ink);text-align:right;width:100%;transition:.2s}
.task .bx{width:42px;height:42px;border-radius:12px;border:3px solid var(--gold);display:grid;place-items:center;font-size:26px;flex:none;background:#fffdf6;transition:.25s}
.task.on{background:linear-gradient(90deg,#e9f7ee,#fff);border-color:#9fd6b2}
.task.on .bx{background:var(--green);border-color:var(--green);color:#fff;transform:rotate(-8deg) scale(1.08)}
.task .st{margin-inline-start:auto;font-size:16px;color:var(--gold3)}
.task.locked{opacity:.65;cursor:not-allowed}
.lockmsg{background:#f3eedf;border:2px dashed #dcc48b;border-radius:16px;padding:12px;text-align:center;color:var(--muted);font-weight:700;margin-bottom:10px}
.rate{display:flex;gap:6px;justify-content:center}
.rate button{background:none;filter:grayscale(1);opacity:.45;transition:.2s;font-size:40px;padding:0}
.rate button.on{filter:none;opacity:1;transform:scale(1.1)}
.sec-title{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:var(--maroon);font-size:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:18px}

/* المعلمة */
.tbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--maroon),var(--maroon2));color:#fff;border-bottom:3px solid var(--gold);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.tbar .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.tbar h2{margin:0;font-size:clamp(20px,3vw,30px);color:var(--gold2)}.tbar .sub{font-size:15px;opacity:.9}
.ibtn{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(243,213,140,.5);border-radius:14px;padding:8px 12px;font-size:20px;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:linear-gradient(180deg,var(--maroon3),var(--maroon2));border-top:3px solid var(--gold);display:flex;justify-content:center;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;max-width:190px;background:none;color:#f0e6c8;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:16px;font-size:15px;font-weight:800;position:relative}
.nav button .e{font-size:26px}.nav button.on{background:rgba(243,213,140,.22);color:#fff;box-shadow:inset 0 0 0 2px var(--gold)}
.badge{position:absolute;top:2px;left:24%;background:var(--red);color:#fff;border-radius:20px;min-width:22px;height:22px;font-size:13px;display:grid;place-items:center;padding:0 6px;border:2px solid #fff;animation:pulse 1.5s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.tmain{padding-bottom:110px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.board{display:grid;gap:12px}
.srow{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;background:#fff;border-radius:20px;padding:12px 16px;border:2px solid #e7d6a6;box-shadow:0 4px 0 #e5d6ab}
.srow .rk{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:22px;background:var(--sand);color:var(--maroon)}
.srow .rk.g1{background:linear-gradient(180deg,#ffe28a,#e0a92e);font-size:26px}
.srow .rk.g2{background:linear-gradient(180deg,#eef0f3,#b9c0c9);font-size:26px}
.srow .rk.g3{background:linear-gradient(180deg,#f3c49b,#c27c45);font-size:26px}
.srow .nm{font-size:clamp(19px,2.3vw,30px);font-weight:900;color:var(--ink);line-height:1.25}
.srow .bar{height:18px;margin-top:8px}
.ctrl{display:flex;align-items:center;gap:10px}
.pm{width:58px;height:58px;border-radius:18px;font-size:34px;font-weight:900;color:#fff;display:grid;place-items:center;transition:transform .1s}
.pm:active{transform:scale(.88)}
.pm.p{background:linear-gradient(180deg,var(--green2),var(--green));box-shadow:0 5px 0 #125428}
.pm.m{background:linear-gradient(180deg,#e2566a,#b3172f);box-shadow:0 5px 0 #7d0f20}
.cnt{min-width:96px;text-align:center;font-size:clamp(28px,3vw,42px);font-weight:900;color:var(--gold3)}
.empty{text-align:center;padding:40px 10px;color:var(--muted);font-size:20px}.empty .big{font-size:70px}
.modes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:#fff;border:2px solid #e7d6a6;border-radius:30px;padding:10px 18px;font-size:18px;font-weight:800;color:var(--maroon)}
.chip.on{background:linear-gradient(180deg,#f0c766,var(--gold));border-color:var(--gold3);color:var(--maroon2)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.team{background:#fff;border-radius:24px;border:3px solid var(--tc);overflow:hidden;box-shadow:var(--shadow)}
.team .th{background:var(--tc);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:22px;font-weight:900}
.team .th .tp{margin-inline-start:auto;background:rgba(255,255,255,.25);border-radius:14px;padding:2px 12px}
.scene{height:190px;position:relative;overflow:hidden}
.scene.tree{background:linear-gradient(180deg,#cfeaff,#eaf7ff 65%,#c8e6a7 65%,#9fd17a)}
.scene.fish{background:linear-gradient(180deg,#bfe6ff 0 22%,#3fa7d6 22%,#1d6fa5)}
.scene.race{background:linear-gradient(180deg,#ffe7b8,#fbd38a 55%,#e8b766 55%,#d9a24f)}
.treebox{position:absolute;bottom:14px;left:50%;transform-origin:bottom center;transition:transform .8s cubic-bezier(.2,.9,.3,1.3)}
.treebox .t{font-size:90px;line-height:1;display:block;text-align:center}
.fruit{position:absolute;font-size:20px;animation:pop .5s}@keyframes pop{from{transform:scale(0)}}
.swim{position:absolute;font-size:28px;animation:swim linear infinite}@keyframes swim{from{transform:translateX(-60px)}to{transform:translateX(360px)}}
.net{position:absolute;top:4px;right:8px;background:rgba(255,255,255,.85);border-radius:14px;padding:4px 8px;font-size:18px;max-width:70%;line-height:1.3;font-weight:800;color:#1d6fa5}
.track{position:absolute;left:12px;right:12px;bottom:40px;border-top:4px dashed rgba(122,72,20,.45)}
.camel{position:absolute;bottom:42px;font-size:58px;transition:right 1s cubic-bezier(.2,.9,.3,1.1)}
.finish{position:absolute;left:10px;bottom:40px;font-size:40px}
.team .tb{padding:12px;display:grid;gap:8px}
.team .mem{display:flex;flex-wrap:wrap;gap:4px}.team .mem span{background:var(--sand);border-radius:10px;padding:2px 8px;font-size:14px;font-weight:700}
.wheel{font-size:clamp(28px,5vw,52px);font-weight:900;color:var(--maroon);min-height:80px;display:grid;place-items:center;text-align:center}
.wheel.spin{animation:jig .1s infinite}@keyframes jig{50%{transform:translateY(-3px)}}
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:17px}
.tbl th{color:var(--maroon);font-weight:900;padding:6px;font-size:15px}
.tbl td{background:#fff;padding:10px 6px;text-align:center;border-top:2px solid #ece0bc;border-bottom:2px solid #ece0bc}
.tbl td:first-child{text-align:right;font-weight:800;border-right:2px solid #ece0bc;border-radius:0 12px 12px 0}
.tbl td:last-child{border-left:2px solid #ece0bc;border-radius:12px 0 0 12px}
.tbl .td{background:#fff6dc}.scroll{overflow-x:auto}
.msg{background:#fff;border:2px solid #e7d6a6;border-radius:18px;padding:14px;margin-bottom:12px}
.msg.unread{border-color:var(--gold);background:linear-gradient(90deg,#fff6dc,#fff)}
.msg .mh{display:flex;gap:8px;align-items:center;font-weight:900;color:var(--maroon);font-size:18px}
.msg .mt{white-space:pre-wrap;font-size:18px;margin:8px 0;line-height:1.7}
.sitem{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #ece0bc;border-radius:14px;padding:8px 12px;margin-bottom:8px}
.sitem .grow{font-weight:800;font-size:18px}
.stat{display:flex;flex-direction:column;align-items:center;background:#fff;border:2px solid #e7d6a6;border-radius:18px;padding:14px;flex:1;min-width:130px}
.stat b{font-size:34px;color:var(--maroon)}
.clslist{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.cls{background:linear-gradient(180deg,#fffef9,#f3ead0);border:3px solid #e6d29f;border-radius:22px;padding:18px;text-align:right;box-shadow:0 6px 0 #dcc48a;color:var(--ink);transition:transform .2s}
.cls:hover{transform:translateY(-3px)}
.cls b{display:block;font-size:26px;color:var(--maroon);font-family:'El Messiri'}
.overlay{position:fixed;inset:0;background:rgba(5,30,20,.55);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:26px;border:3px solid var(--gold);padding:22px;width:min(600px,100%);max-height:88vh;overflow:auto;animation:enter .3s cubic-bezier(.2,.9,.3,1.3)}
.modal h3{margin:0 0 10px;color:var(--maroon);font-size:24px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;background:var(--maroon2);color:#fff;border:2px solid var(--gold);padding:12px 22px;border-radius:16px;font-weight:800;font-size:17px;box-shadow:var(--shadow);animation:enter .3s}
.confetti{position:fixed;top:-20px;z-index:150;pointer-events:none;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.flystar{position:fixed;z-index:160;font-size:40px;pointer-events:none;transition:all .8s cubic-bezier(.5,-0.3,.6,1)}
.spinner{width:44px;height:44px;border:5px solid #ece0bc;border-top-color:var(--maroon);border-radius:50%;animation:spin 1s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{background:#fff3cd;border:2px solid #f0c766;border-radius:14px;padding:10px 14px;font-weight:700;margin:12px 0}
@media (max-width:640px){
  .brand{flex-direction:column;text-align:center}
  .phead{flex-wrap:wrap;justify-content:center;text-align:center}.starbox{margin:0 auto}
  .week{gap:4px}.day{padding:8px 2px}.day .dn{font-size:12px}.day small{font-size:11px}
  .srow{grid-template-columns:40px 1fr;padding:10px}.srow .rk{width:38px;height:38px;font-size:18px}
  .srow .ctrl{grid-column:1/-1;justify-content:space-between}.pm{width:52px;height:52px}
  .nav button{font-size:12px}.nav button .e{font-size:22px}
  .tbar .mascot{display:none}.tbar h2{font-size:20px}.tbar .sub{font-size:12px}.ibtn{padding:6px 8px;font-size:17px}
  .toolbar .inp{max-width:none!important}
}
</style>
</head>
<body>
<div class="flagbar"></div>
<div id="app"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyHtIHJ_5_m5b2ShUhCox0Xn5DDl0ddGlKKwKyOVnRp-8jRzhChrQZHH9aQIK0Vz82C/exec";
const HERO = "file_00000000e740821194dbc83a9a5c3936.png";
const PARENT_CODE = "1656";
const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const TEAM_PRESETS = [
  {name:'الصقور',icon:'🦅',color:'#0f5c3c'},{name:'النخيل',icon:'🌴',color:'#2e9b55'},
  {name:'القلاع',icon:'🏰',color:'#b8862b'},{name:'السفن',icon:'⛵',color:'#1d6fa5'},
  {name:'الجبال',icon:'⛰️',color:'#6b4ba1'},{name:'اللؤلؤ',icon:'💎',color:'#c8102e'}
];
const SUBJ_ICON=[['الرياضيات','🔢'],['العلوم','🔬'],['الإنجليزية','🔤'],['الانجليزية','🔤'],['الإسلامية','🕌'],['الاسلامية','🕌'],['العربية','📖'],['البدنية','⚽'],['البصرية','🎨'],['الموسيقية','🎵'],['تقنية','💻'],['المواطنة','🇴🇲']];
const subjIcon=s=>{s=s||'';for(const [k,e] of SUBJ_ICON) if(s.includes(k)) return e;return '👩‍🏫'};
const shortName=n=>{const w=String(n||'').trim().split(/ +/);return w.length>2?w[0]+' '+w[w.length-1]:w.join(' ')};
const $app=document.getElementById('app');
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* الأصوات */
let AC=null, muted=store.get('abt_mute')||false;
function tone(f,d,type='sine',v=.15,delay=0){
  if(muted) return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}
}
const SFX={click(){tone(520,.07,'square',.04)},plus(){tone(660,.12,'triangle',.16);tone(990,.2,'triangle',.13,.08)},
  minus(){tone(300,.16,'sawtooth',.07);tone(200,.22,'sawtooth',.06,.1)},tick(){tone(880,.1,'sine',.14);tone(1320,.18,'sine',.11,.07)},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.13,i*.11))},whoosh(){tone(400,.25,'sine',.05);tone(800,.2,'sine',.04,.05)},err(){tone(180,.3,'square',.06)}};

function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function confetti(n=70){const cols=['#0f5c3c','#d6a54a','#c8102e','#ffffff','#2e9b55','#f3d58c'];
  for(let i=0;i<n;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];
    c.style.animationDuration=(2+Math.random()*2.5)+'s';c.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5200)}}
function flyStar(a0,b0){if(!a0||!b0)return;const a=a0.getBoundingClientRect(),b=b0.getBoundingClientRect();const s=document.createElement('div');s.className='flystar';s.textContent='⭐';
  s.style.left=(a.left+a.width/2-20)+'px';s.style.top=(a.top+a.height/2-20)+'px';document.body.appendChild(s);
  requestAnimationFrame(()=>{s.style.left=(b.left+b.width/2-20)+'px';s.style.top=(b.top+b.height/2-20)+'px';s.style.transform='scale(.5) rotate(360deg)';s.style.opacity='.4'});setTimeout(()=>s.remove(),850)}
function bump(el){if(!el)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function modal(html,onMount){const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="modal">${html}</div>`;
  o.addEventListener('click',e=>{if(e.target===o)o.remove()});document.body.appendChild(o);const close=()=>o.remove();onMount&&onMount(o,close);return close}
function confirmBox(msg,yes,yesText='نعم، متأكدة'){modal(`<h3>تأكيد</h3><p style="font-size:19px;line-height:1.8">${msg}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost sm" data-x>إلغاء</button><button class="btn sm" data-y>${esc(yesText)}</button></div>`,
  (o,close)=>{o.querySelector('[data-x]').onclick=close;o.querySelector('[data-y]').onclick=()=>{close();yes()}})}
function mascot(size=110){return `<span class="mascot"><svg viewBox="0 0 120 120" width="${size}" height="${size}">
  <defs><radialGradient id="sg" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#fff3b0"/><stop offset=".55" stop-color="#ffd23f"/><stop offset="1" stop-color="#e09a12"/></radialGradient></defs>
  <path d="M60 18 L73 48 L106 50 L80 71 L89 104 L60 86 L31 104 L40 71 L14 50 L47 48 Z" fill="url(#sg)" stroke="#b8862b" stroke-width="3" stroke-linejoin="round"/>
  <ellipse class="eye" cx="50" cy="62" rx="5" ry="7" fill="#1f2a22"/><ellipse class="eye" cx="70" cy="62" rx="5" ry="7" fill="#1f2a22"/>
  <circle cx="52" cy="59" r="1.8" fill="#fff"/><circle cx="72" cy="59" r="1.8" fill="#fff"/>
  <path d="M50 74 Q60 83 70 74" stroke="#1f2a22" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <circle cx="41" cy="72" r="5" fill="#ff8f8f" opacity=".55"/><circle cx="79" cy="72" r="5" fill="#ff8f8f" opacity=".55"/>
  <path d="M36 30 L60 19 L84 30 L60 41 Z" fill="#0f5c3c" stroke="#0a4029" stroke-width="2"/><path d="M46 35 L46 43 Q60 50 74 43 L74 35 L60 41 Z" fill="#0a4029"/>
  <path d="M84 30 L88 46" stroke="#d6a54a" stroke-width="2.5"/><circle cx="88" cy="48" r="3.5" fill="#d6a54a"/><circle cx="60" cy="30" r="2.5" fill="#d6a54a"/></svg></span>`}
function fmtTime(iso){try{return new Date(iso).toLocaleString('ar-OM',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}catch(e){return iso}}
function dshort(ds){const p=ds.split('-');return (+p[2])+'/'+(+p[1])}
const barColors=['#d6a54a','#1d7a3e','#0f5c3c','#1d6fa5','#6b4ba1','#c8102e','#e07b1a'];
function barFor(i,pct){const c=barColors[i%barColors.length];return `<div class="bar"><i style="width:${Math.min(100,pct)}%;background:linear-gradient(90deg,${c},${c}cc)"></i></div>`}

const READY=API&&API.indexOf('http')===0;
async function api(action,payload={}){
  if(!READY) throw new Error('لم يتم ربط المنصة بالخادم بعد');
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},payload))});
  const j=await r.json(); if(!j.ok) throw new Error(j.err||'حدث خطأ'); return j;
}
function loading(){$app.innerHTML=`<div class="wrap"><div class="spinner"></div><p class="center muted">لحظات...</p></div>`}

/* =============== الرئيسية التفاعلية =============== */
let siteVisits=null;
const HOTS=[
  {k:'start',l:38.4,t:81.8,w:22.8,h:14.2,pulse:1}
];
function home(){
  stopPoll();
  $app.innerHTML=`<div class="wrap screen">
    <div class="hero"><img src="${HERO}" alt="منصة أبطال المشارق"><div class="htitle"><b>منصة أبطال المشارق</b><i></i></div>${HOTS.map(h=>`<button class="hot ${h.pulse?'pulse':''}" data-k="${h.k}" aria-label="${h.k}" style="left:${h.l}%;top:${h.t}%;width:${h.w}%;height:${h.h}%"></button>`).join('')}</div>
    <div class="card brand">${mascot(110)}<div><h1>منصة أبطال المشارق</h1><p>رحلة النجوم بين البيت والمدرسة ✨ كل إنجاز نجمة في رحلتك</p><p style="font-size:15px;opacity:.85">مدرسة المشارق للتعليم الأساسي — سلطنة عُمان</p></div></div>
    ${READY?'':'<div class="notice">⚠️ المنصة في وضع الإعداد — لم يتم ربط الخادم بعد.</div>'}
    <div class="tiles">
      <button class="tile" onclick="SFX.click();parentLogin()"><span class="ic">👨‍👩‍👧</span><b>دخول ولي الأمر</b><small>تابع نجوم ابنك عند كل معلمة</small></button>
      <button class="tile" onclick="SFX.click();teacherLogin()"><span class="ic" style="animation-delay:.5s">👩‍🏫</span><b>دخول المعلمة</b><small>برمزك الخاص تظهر صفوفك فقط</small></button>
    </div>
    <div class="foot"><span class="pill">👀 عدد الزيارات: <b id="vis">${siteVisits??'...'}</b></span><div style="margin-top:10px">🇴🇲 رؤية عُمان 2040 — معًا نصنع جيلًا متميزًا</div></div>
  </div>`;
  $app.querySelectorAll('.hot').forEach(b=>b.onclick=()=>{SFX.whoosh();({start:startJourney,heritage:heritage,gov:governorates,chal:challenges})[b.dataset.k]()});
  if(siteVisits===null&&READY){let first=false;try{first=!sessionStorage.getItem('abt_v');sessionStorage.setItem('abt_v','1')}catch(e){}
    api('visit',{peek:!first}).then(r=>{siteVisits=r.visits;const v=document.getElementById('vis');if(v)v.textContent=r.visits}).catch(()=>{})}
}
function startJourney(){modal(`<h3 class="center">🚀 ابدأ الرحلة</h3><p class="center muted">من أنت؟</p><div class="tiles" style="margin-top:6px">
  <button class="tile" data-p><span class="ic">👨‍👩‍👧</span><b>ولي الأمر</b></button><button class="tile" data-t><span class="ic">👩‍🏫</span><b>المعلمة</b></button></div>`,
  (o,close)=>{o.querySelector('[data-p]').onclick=()=>{close();parentLogin()};o.querySelector('[data-t]').onclick=()=>{close();teacherLogin()}})}
function heritage(){
  const items=[['🗡️','الخنجر','رمز عُماني أصيل يلبسه الرجال في المناسبات، ويظهر في شعار السلطنة.'],['☕','القهوة والدلّة','تُقدَّم القهوة العمانية مع التمر ترحيبًا بالضيف، وهي من أجمل عادات الكرم.'],
    ['🌳','اللُّبان','شجرة تنمو في محافظة ظفار، ويُستخرج منها اللبان المشهور منذ آلاف السنين.'],['🍯','الحلوى العمانية','حلوى تقليدية تُقدَّم في الأعياد والمناسبات مع القهوة.'],
    ['🏰','القلاع والحصون','تنتشر في عُمان قلاع وحصون تاريخية مثل قلعة نزوى وحصن جبرين.'],['💧','الأفلاج','قنوات ماء قديمة تسقي المزارع والنخيل، وبعضها مسجّل في قائمة التراث العالمي.']];
  modal(`<h3>🏺 التراث العُماني</h3><p class="muted" style="margin-top:-4px">اضغط على كل بطاقة لتكتشف سرّها!</p><div class="fact">${items.map((x,i)=>`<button class="flip" data-i="${i}"><span class="e">${x[0]}</span>${x[1]}</button>`).join('')}</div>`,
    o=>o.querySelectorAll('.flip').forEach(b=>b.onclick=()=>{const x=items[+b.dataset.i];SFX.tick();b.classList.toggle('open');b.innerHTML=b.classList.contains('open')?`<span class="e">${x[0]}</span>${x[2]}`:`<span class="e">${x[0]}</span>${x[1]}`}));
}
function governorates(){
  const g=[['مسقط','مسقط'],['ظفار','صلالة'],['مسندم','خصب'],['البريمي','البريمي'],['الداخلية','نزوى'],['شمال الباطنة','صحار'],['جنوب الباطنة','الرستاق'],['شمال الشرقية','إبراء'],['جنوب الشرقية','صور'],['الظاهرة','عبري'],['الوسطى','هيماء']];
  modal(`<h3>🗺️ محافظات سلطنة عُمان (${g.length})</h3><p class="muted" style="margin-top:-4px">اضغط على المحافظة لتعرف مركزها</p><div class="fact">${g.map((x,i)=>`<button class="flip" data-i="${i}"><span class="e">📍</span>${x[0]}</button>`).join('')}</div>`,
    o=>o.querySelectorAll('.flip').forEach(b=>b.onclick=()=>{const x=g[+b.dataset.i];SFX.tick();b.classList.toggle('open');b.innerHTML=b.classList.contains('open')?`<span class="e">🏙️</span>محافظة ${x[0]}<br>مركزها: <b>${x[1]}</b>`:`<span class="e">📍</span>${x[0]}`}));
}
function challenges(){
  const Q=[['ما عاصمة سلطنة عُمان؟',['مسقط','صلالة','نزوى'],0],['ما ألوان علم سلطنة عُمان؟',['الأبيض والأحمر والأخضر','الأزرق والأبيض','الأسود والأصفر'],0],
    ['في أي محافظة تنمو شجرة اللبان؟',['ظفار','مسندم','الظاهرة'],0],['كم عدد محافظات سلطنة عُمان؟',['11','7','15'],0],['متى نحتفل بالعيد الوطني العُماني؟',['20 نوفمبر','1 يناير','10 مارس'],0]];
  let i=0,score=0;
  modal('',(o,close)=>{const m=o.querySelector('.modal');const draw=()=>{
    if(i>=Q.length){m.innerHTML=`<h3 class="center">🏆 انتهى التحدي!</h3><div class="center" style="font-size:60px">${score===Q.length?'🥇':score>=3?'🥈':'⭐'}</div><p class="center" style="font-size:22px;font-weight:800">نتيجتك: ${score} من ${Q.length}</p><div class="row" style="justify-content:center"><button class="btn gold" data-a>🔁 أعد التحدي</button><button class="btn ghost" data-c>إغلاق</button></div>`;
      if(score>=4){SFX.win();confetti(80)}m.querySelector('[data-a]').onclick=()=>{i=0;score=0;draw()};m.querySelector('[data-c]').onclick=close;return}
    const q=Q[i],ord=q[1].map((t,k)=>[t,k]).sort(()=>Math.random()-.5);
    m.innerHTML=`<h3>🏆 تحدي عُمان — سؤال ${i+1} من ${Q.length}</h3><p style="font-size:21px;font-weight:800">${q[0]}</p>${ord.map(x=>`<button class="qopt" data-k="${x[1]}">${x[0]}</button>`).join('')}`;
    m.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q[2];b.classList.add(ok?'ok':'no');if(ok){score++;SFX.tick()}else{SFX.err();m.querySelector(`[data-k="${q[2]}"]`).classList.add('ok')}
      m.querySelectorAll('.qopt').forEach(x=>x.disabled=true);setTimeout(()=>{i++;draw()},1100)})};draw()});
}

/* =============== ولي الأمر =============== */
let P=null,pSel=null,pT=null,pBusy=false;
function parentLogin(err){
  $app.innerHTML=`<div class="wrap screen"><div class="card gold login">
    <button class="back" onclick="home()">→ الرئيسية</button>
    <div class="top">${mascot(100)}<h2 style="margin:0;color:var(--maroon)">أهلًا ولي الأمر الكريم</h2><p class="muted" style="margin:0">ادخل لمتابعة نجوم ابنك</p></div>
    <form id="pf">
      <label class="field"><span>🔑 رمز ولي الأمر</span><input class="inp" id="pc" inputmode="numeric" type="password" autocomplete="off" placeholder="••••" required></label>
      <label class="field"><span>🧒 اسم الطالب الثلاثي</span><input class="inp" id="pn" placeholder="مثال: محمد سالم علي" required></label>
      <button class="btn wide" type="submit">دخول ✨</button>${err?`<div class="err">${esc(err)}</div>`:''}
    </form></div></div>`;
  document.getElementById('pf').onsubmit=async e=>{e.preventDefault();
    const code=pc.value.trim(),name=pn.value.trim(),btn=e.target.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='جارٍ البحث...';
    try{const r=await api('parentLogin',{code,name});
      if(r.matches.length===1) return openParent(code,r.matches[0]);
      modal(`<h3>اختر الطالب</h3><p>وجدنا أكثر من طالب بهذا الاسم:</p>${r.matches.map((m,i)=>`<button class="cls" style="width:100%;margin-bottom:10px" data-i="${i}"><b style="font-size:20px">${esc(m.name)}</b>الصف ${esc(m.className)}</button>`).join('')}`,
        (o,close)=>o.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{close();openParent(code,r.matches[+b.dataset.i])}));
      btn.disabled=false;btn.textContent='دخول ✨';
    }catch(x){SFX.err();parentLogin(x.message)}};
}
async function openParent(code,m){store.set('abt_parent',{code,classId:m.classId,sid:m.sid});loading();
  try{const r=await api('parentData',{code,classId:m.classId,sid:m.sid,countVisit:true});setP(r.view,code);pSel=P.today;SFX.win();parentHome(true)}
  catch(x){store.del('abt_parent');parentLogin(x.message)}}
function setP(view,code){P=view;P.code=code||P.code;if(!pT||!P.teachers.some(t=>t.tid===pT)){const best=P.teachers.slice().sort((a,b)=>b.pts-a.pts)[0];pT=best?best.tid:null}}
function keepP(view){setP(view,P.code)}
function curT(){return P.teachers.find(t=>t.tid===pT)}
function parentHome(first){
  const v=P,T0=curT(),total=v.teachers.reduce((a,t)=>a+t.pts,0);
  if(!T0){$app.innerHTML=`<div class="wrap screen"><div class="card phead">${mascot(90)}<div><h2>${esc(v.name)}</h2><div class="sub">الصف ${esc(v.className)}</div></div></div><div class="card empty" style="margin-top:18px"><div class="big">👩‍🏫</div>لم تُربط معلمات بهذا الصف بعد</div><div class="center" style="margin-top:14px"><button class="btn ghost sm" onclick="parentLogout()">🚪 تسجيل الخروج</button></div></div>`;return}
  const pct=Math.round((T0.pts%T0.goal)/T0.goal*100),done=Math.floor(T0.pts/T0.goal),isToday=pSel===v.today,isPast=pSel<v.today,ticks=T0.home[pSel]||[];
  $app.innerHTML=`<div class="wrap screen">
    <div class="card phead">${mascot(92)}
      <div><div class="sub">أهلًا بولي أمر البطل/ة</div><h2>${esc(v.name)}</h2><div class="sub">📚 الصف ${esc(v.className)} · مجموع النجوم ${total} ⭐</div></div>
      <div class="starbox"><div class="n" id="pstars">${T0.pts}</div><div>⭐ عند ${esc(shortName(T0.name))}</div></div>
    </div>
    <div class="tchips">${v.teachers.map(t=>`<button class="tchip ${t.tid===pT?'on':''}" data-t="${t.tid}"><span class="e">${subjIcon(t.subjects)}</span><span>أ. ${esc(shortName(t.name))}<small>${esc(t.subjects)}</small></span><span class="s">${t.pts}⭐</span></button>`).join('')}</div>
    <div class="card">
      <div class="row"><b style="font-size:19px;color:var(--maroon)">🎯 الطريق إلى الهدف مع أ. ${esc(shortName(T0.name))}</b><span class="grow"></span><span class="muted">باقي <b>${T0.goal-(T0.pts%T0.goal)}</b> نجمة للوصول إلى ${T0.goal}</span></div>
      <div class="bar" style="margin-top:10px"><i style="width:${pct}%"></i></div>
      ${done?`<div class="center" style="margin-top:8px;font-weight:800;color:var(--green)">${'🏅'.repeat(Math.min(done,10))} أحسنت! وصلت الهدف ${done} ${done>1?'مرات':'مرة'}</div>`:''}
    </div>
    <div class="card" style="margin-top:18px">
      <h3 class="sec-title">🏠 إنجازات البيت — ${esc(T0.subjects||'')}</h3>
      <div class="week">${v.week.map((d,i)=>{const c=(T0.home[d]||[]).length,cls=d===v.today?'today':(d<v.today?'past':'future');

    o.querySelectorAll('[data-tn]').forEach(inp=>inp.oninput=()=>teams[+inp.dataset.tn].name=inp.value);
    o.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;
      if(n>teams.length){for(let i=teams.length;i<n;i++){const p=TEAM_PRESETS[i];let id='T'+(i+1);while(teams.some(t=>t.id===id))id+='x';teams.push({id,name:p.name,icon:p.icon,color:p.color,members:[]})}}else teams=teams.slice(0,n);draw(o)});
    o.querySelector('[data-rand]').onclick=()=>{SFX.whoosh();const ids=d.students.map(s=>s.id).sort(()=>Math.random()-.5);teams.forEach(t=>t.members=[]);ids.forEach((id,i)=>teams[i%teams.length].members.push(id));draw(o)};
    o.querySelectorAll('[data-s]').forEach(se=>se.onchange=()=>{teams.forEach(t=>t.members=t.members.filter(m=>m!==se.dataset.s));const t=teams.find(t=>t.id===se.value);if(t)t.members.push(se.dataset.s)});
    o.querySelector('[data-x]').onclick=()=>o.remove();
    o.querySelector('[data-save]').onclick=()=>{o.remove();SFX.win();op('setTeams',{teams},x=>{const old={};x.teams.forEach(t=>old[t.id]=t.pts||0);x.teams=teams.map(t=>Object.assign({},t,{pts:old[t.id]||0}))});toast('تم حفظ الفرق ✅')}};
  modal('',o=>draw(o));
}
function tHome(el){
  const d=T.data,wk=T.week;
  el.innerHTML=`<div class="card"><h3 class="sec-title">📝 مهامّي المنزلية التي يراها أولياء الأمور</h3>
      <p class="muted" style="margin-top:-6px">هذه المهام خاصة بكِ وبمادتك. كل مهمة ينجزها الطالب في البيت = نجمة ⭐ في لوحتك. يسجّلها ولي الأمر لليوم الحالي فقط.</p>
      <div id="tl">${d.tasks.map(t=>`<div class="sitem"><span>🏠</span><input class="inp grow" value="${esc(t)}" style="padding:8px 12px" data-ti><button class="btn ghost sm" data-del>🗑️</button></div>`).join('')}</div>
      <div class="row"><button class="btn ghost sm" id="addt">➕ إضافة مهمة</button><span class="grow"></span><button class="btn green sm" id="savet">💾 حفظ المهام</button></div></div>
    <div class="card" style="margin-top:18px"><h3 class="sec-title">📊 إنجازات البيت هذا الأسبوع</h3>
      <div class="scroll"><table class="tbl"><thead><tr><th style="text-align:right">الطالب</th>${wk.map((x,i)=>`<th class="${x===T.today?'td':''}">${DAYS[i]}<br><small>${dshort(x)}</small></th>`).join('')}<th>المجموع</th></tr></thead>
      <tbody>${d.students.map(s=>{let sum=0;return `<tr><td>${esc(s.name)}</td>${wk.map(x=>{const c=((s.home||{})[x]||[]).length;sum+=c;return `<td class="${x===T.today?'td':''}">${x>T.today?'—':(c?`<b style="color:var(--green)">${c}</b>`:'<span class="muted">0</span>')}</td>`}).join('')}<td><b>${sum} ⭐</b></td></tr>`}).join('')}</tbody></table></div></div>`;
  const tl=el.querySelector('#tl'),bindDel=()=>tl.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>b.closest('.sitem').remove());bindDel();
  el.querySelector('#addt').onclick=()=>{const div=document.createElement('div');div.className='sitem';div.innerHTML=`<span>🏠</span><input class="inp grow" style="padding:8px 12px" data-ti placeholder="مهمة جديدة..."><button class="btn ghost sm" data-del>🗑️</button>`;tl.appendChild(div);bindDel();div.querySelector('input').focus()};
  el.querySelector('#savet').onclick=()=>{const tasks=[...tl.querySelectorAll('[data-ti]')].map(i=>i.value.trim()).filter(Boolean);if(!tasks.length){toast('أضيفي مهمة واحدة على الأقل');return}
    confirmBox('سيتم تحديث مهامك لأولياء الأمور. لن تتأثر نجوم الطلاب. متابعة؟',()=>{SFX.win();op('setTasks',{tasks},x=>x.tasks=tasks);toast('تم حفظ المهام ✅')},'حفظ')};
}
function tMsgs(el){
  const ms=T.messages||[];
  el.innerHTML=`<div class="card"><h3 class="sec-title">💌 رسائل أولياء الأمور الخاصة <span class="pill" style="font-size:15px">${unread()} غير مقروءة</span></h3>
    ${ms.length?ms.map(m=>`<div class="msg ${m.read?'':'unread'}"><div class="mh">${m.read?'📭':'📩'} ولي أمر: ${esc(m.name)}<span class="grow"></span><small class="muted" style="font-weight:500">${fmtTime(m.time)}</small></div>
      <div class="mt">${esc(m.text)}</div><div class="row">${m.read?'':`<button class="btn green sm" data-rd="${m.id}">✓ تمت القراءة</button>`}<button class="btn ghost sm" data-dl="${m.id}">🗑️ حذف</button></div></div>`).join('')
    :'<div class="empty"><div class="big">📭</div>لا توجد رسائل بعد</div>'}</div>`;
  el.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{SFX.tick();op('msgRead',{id:b.dataset.rd},()=>{T.messages.find(m=>m.id===b.dataset.rd).read=true})});
  el.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>confirmBox('حذف هذه الرسالة نهائيًا؟',()=>op('msgDel',{id:b.dataset.dl},()=>{T.messages=T.messages.filter(m=>m.id!==b.dataset.dl)}),'حذف'));
}
function tGroup(el){
  const d=T.data;
  el.innerHTML=`<div class="card gold"><h3 class="sec-title">🔎 أضيفي طالبًا من أي صف</h3>
      <p class="muted" style="margin-top:-6px">اكتبي جزءًا من اسم الطالب، ثم اضغطي «إضافة». يظهر الطالب في لوحتك، ويرى ولي أمره نجومه عندك.</p>
      <input class="inp" id="gq" placeholder="مثال: محمد سالم">
      <div id="gres" style="margin-top:10px"></div></div>
    <div class="card" style="margin-top:18px"><h3 class="sec-title">🧒 طلابي (${d.students.length})</h3>
      ${d.students.length?d.students.map(s=>`<div class="sitem"><span class="grow">${esc(s.name)} <small class="muted">— ${esc(s.cls)}</small></span><button class="btn ghost sm" data-gr="${s.id}">🗑️ إزالة</button></div>`).join(''):'<div class="empty">لم تُضيفي طلابًا بعد</div>'}</div>
    <div class="card" style="margin-top:18px"><h3 class="sec-title">⚙️ إعدادات لوحتي</h3>
      <label class="field"><span>🎯 هدف النجوم</span><input class="inp" id="st_g" type="number" min="5" max="500" value="${d.goal}"></label>
      <button class="btn green sm" id="sv">💾 حفظ</button>
      <button class="btn sm" id="rst" style="margin-inline-start:8px">🔄 تصفير نجومي لشهر جديد</button></div>`;
  let timer=null;const gq=el.querySelector('#gq'),gres=el.querySelector('#gres');
  gq.oninput=()=>{clearTimeout(timer);const q=gq.value.trim();if(q.length<2){gres.innerHTML='';return}
    timer=setTimeout(async()=>{gres.innerHTML='<div class="spinner" style="width:28px;height:28px;margin:10px auto"></div>';
      try{const r=await api('tSearch',{code:TC,q});const have=new Set(d.students.map(s=>s.id));
        gres.innerHTML=r.results.length?r.results.map(x=>`<div class="sitem"><span class="grow">${esc(x.name)} <small class="muted">— ${esc(x.className)}</small></span>${have.has(x.cid+':'+x.sid)?'<span class="pill">✓ مضاف</span>':`<button class="btn green sm" data-ga="${esc(x.cid)}|${esc(x.sid)}">➕ إضافة</button>`}</div>`).join(''):'<p class="muted">لا نتائج</p>';
        gres.querySelectorAll('[data-ga]').forEach(b=>b.onclick=()=>{const [cid,sid]=b.dataset.ga.split('|');SFX.plus();b.outerHTML='<span class="pill">✓ مضاف</span>';
          op('addMember',{cid,sid}).then(()=>toast('تمت الإضافة ✅'))});
      }catch(x){gres.innerHTML=`<div class="err">${esc(x.message)}</div>`}},400)};
  el.querySelectorAll('[data-gr]').forEach(b=>b.onclick=()=>{const s=d.students.find(x=>x.id===b.dataset.gr);
    confirmBox(`إزالة <b>${esc(s.name)}</b> من طلابك؟ ستُحذف نجومه في لوحتك.`,()=>op('removeMember',{key:s.id},x=>{x.students=x.students.filter(y=>y.id!==s.id)}),'إزالة')});
  el.querySelector('#sv').onclick=()=>{SFX.win();op('setGoal',{goal:+el.querySelector('#st_g').value},x=>x.goal=+el.querySelector('#st_g').value);toast('تم الحفظ ✅')};
  el.querySelector('#rst').onclick=()=>confirmBox('سيتم تصفير نجوم لوحتك. هل أنتِ متأكدة؟',()=>{SFX.whoosh();op('resetPts',{},x=>{x.students.forEach(s=>s.pts=0);x.teams.forEach(t=>t.pts=0)})},'نعم، صفّري');
}
function tStudents(el){
  if(String(T.classId).startsWith('G-')) return tGroup(el);
  const d=T.data,link=location.href.split('#')[0].split('?')[0];
  const share=`السلام عليكم ورحمة الله 🌟\nيسعدنا انضمامكم إلى «منصة أبطال المشارق» لمتابعة نجوم أبنائكم عند كل معلمة وتسجيل إنجازاتهم في البيت.\n\n🔗 الرابط: ${link}\n🔑 رمز ولي الأمر: ${PARENT_CODE}\n🧒 ثم اكتبوا اسم الطالب الثلاثي\n\nالصف ${T.className} — أ. ${T.teacher}`;
  el.innerHTML=`<div class="card" style="margin-bottom:18px"><h3 class="sec-title">📈 إحصائيات</h3><div class="row">
      <div class="stat"><b>${T.stats.visits}</b>زيارة لأولياء أمور الصف</div><div class="stat"><b>${T.stats.ratingAvg||'—'} ⭐</b>تقييمك (${T.stats.ratingCount})</div>
      <div class="stat"><b>${d.students.reduce((a,s)=>a+s.pts,0)}</b>مجموع نجوم لوحتك</div></div></div>
    <div class="card"><h3 class="sec-title">📣 رسالة جاهزة لأولياء الأمور</h3><textarea class="inp" rows="8" id="share" readonly>${esc(share)}</textarea>
      <button class="btn gold" style="margin-top:10px" id="cp">📋 نسخ الرسالة</button></div>
    <div class="grid2">
      <div class="card"><h3 class="sec-title">🧒 طلاب الصف (${d.students.length})</h3>
        <p class="muted" style="margin-top:-6px">⚠️ قائمة الطلاب مشتركة مع كل معلمات الصف، فالإضافة والتعديل والحذف تظهر عندهن أيضًا. أما النجوم فخاصة بكِ.</p>
        <div style="max-height:360px;overflow:auto">${d.students.map(s=>`<div class="sitem" data-sid="${s.id}"><span class="grow">${esc(s.name)}</span><button class="btn ghost sm" data-ed>✏️</button><button class="btn ghost sm" data-rm>🗑️</button></div>`).join('')}</div>
        <textarea class="inp" id="names" rows="3" placeholder="إضافة طالب جديد: اسم ثلاثي في كل سطر" style="margin-top:10px"></textarea>
        <button class="btn green sm" style="margin-top:8px" id="addn">➕ إضافة</button></div>
      <div class="card"><h3 class="sec-title">⚙️ إعدادات لوحتي</h3>
        <label class="field"><span>🎯 هدف النجوم</span><input class="inp" id="st_g" type="number" min="5" max="500" value="${d.goal}"></label>
        <button class="btn green sm" id="sv">💾 حفظ</button>
        <hr style="border:0;border-top:2px dashed #e7d6a6;margin:18px 0">
        <h3 class="sec-title">🗓️ التصفير الشهري</h3><p class="muted">يعيد نجوم لوحتك ونقاط فرقك في هذا الصف إلى صفر. لا يؤثر على نجوم المعلمات الأخريات.</p>
        <button class="btn" id="rst">🔄 تصفير نجومي لبداية شهر جديد</button></div>
    </div>`;
  el.querySelector('#addn').onclick=()=>{const names=el.querySelector('#names').value.split(/\n+/).map(s=>s.trim()).filter(Boolean);if(!names.length)return;
    confirmBox(`إضافة ${names.length} طالب/ة إلى الصف ${esc(T.className)} لكل المعلمات؟`,()=>{SFX.win();op('addStudents',{names})},'إضافة')};
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const sid=b.closest('.sitem').dataset.sid,s=d.students.find(x=>x.id===sid);
    confirmBox(`حذف <b>${esc(s.name)}</b> من الصف عند كل المعلمات؟`,()=>op('delStudent',{sid},x=>{x.students=x.students.filter(y=>y.id!==sid)}),'حذف')});
  el.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const sid=b.closest('.sitem').dataset.sid,s=d.students.find(x=>x.id===sid);
    modal(`<h3>✏️ تعديل الاسم</h3><input class="inp" id="en" value="${esc(s.name)}"><p class="muted">النجوم لا تتأثر بتعديل الاسم.</p><div class="row" style="justify-content:flex-end"><button class="btn ghost sm" data-x>إلغاء</button><button class="btn sm" data-y>حفظ</button></div>`,
      (o,close)=>{o.querySelector('[data-x]').onclick=close;o.querySelector('[data-y]').onclick=()=>{const name=o.querySelector('#en').value.trim();if(!name)return;close();op('renameStudent',{sid,name},()=>s.name=name)}})});
  el.querySelector('#cp').onclick=()=>{const ta=el.querySelector('#share');ta.select();try{navigator.clipboard.writeText(ta.value)}catch(e){document.execCommand('copy')}SFX.tick();toast('تم نسخ الرسالة 📋')};
  el.querySelector('#sv').onclick=()=>{SFX.win();op('setGoal',{goal:+el.querySelector('#st_g').value},x=>x.goal=+el.querySelector('#st_g').value);toast('تم الحفظ ✅')};
  el.querySelector('#rst').onclick=()=>confirmBox('سيتم تصفير نجوم لوحتك في هذا الصف. هل أنتِ متأكدة؟',()=>{SFX.whoosh();op('resetPts',{},x=>{x.students.forEach(s=>s.pts=0);x.teams.forEach(t=>t.pts=0)});toast('تم التصفير — شهر جديد موفّق 🌙')},'نعم، صفّري');
}

/* البدء */
(async function boot(){
  const tc=store.get('abt_tcode'),cid=store.get('abt_class'),pp=store.get('abt_parent');
  if(READY&&tc){TC=tc;
    if(cid){loading();try{const r=await api('tOpen',{code:tc,classId:cid});enterClass(r.view);return}catch(e){store.del('abt_class')}}
    return classesScreen();
  }
  if(READY&&pp){loading();try{const r=await api('parentData',{code:pp.code,classId:pp.classId,sid:pp.sid,countVisit:true});setP(r.view,pp.code);pSel=P.today;parentHome(true);return}catch(e){store.del('abt_parent')}}
  home();
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&P&&!pBusy){api('parentData',{code:P.code,classId:P.classId,sid:P.sid}).then(r=>{keepP(r.view);if(!document.querySelector('.overlay')&&document.activeElement.tagName!=='TEXTAREA'){if(!P.week.includes(pSel))pSel=P.today;parentHome()}}).catch(()=>{})}});
</script>
</body>
</html>
